name: Windows 11 build

on:
  push:
    branches: [main]
    paths:
      - "win11/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "win11/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win-x64:
    name: Build WinUI and Direct3D x64
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build native Direct3D module and publish app
        shell: pwsh
        run: ./win11/scripts/build.ps1 -Configuration Release

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SikaMTV-Windows-x64
          path: win11/artifacts/publish/win-x64/
          if-no-files-found: error
          retention-days: 14
